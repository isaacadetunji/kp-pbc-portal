<!doctype html>
<html><body style="margin:0;background:#f6f8fb;font-family:Segoe UI,Arial,sans-serif;color:#0f172a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #dde3ec">
        <tr><td style="padding:22px 28px 18px;border-bottom:4px solid #43BBC7;border-radius:12px 12px 0 0"><img src="{{ .SiteURL }}/kreston-pedabo-logo.png" alt="Kreston Pedabo" width="190" style="display:block;height:auto"><div style="font-size:12px;color:#5b6474;margin-top:6px;letter-spacing:.04em">PBC PORTAL</div></td></tr>
        <tr><td style="padding:28px">
          <h1 style="font-size:20px;margin:0 0 12px">Reset your password</h1>
          <p style="font-size:15px;line-height:1.6;margin:0 0 24px">We received a request to reset your password. If this wasn't you, ignore this email.</p>
          <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/set-password" style="background:#0F77AD;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;display:inline-block;font-weight:600">Choose a new password</a></p>
          <p style="font-size:12px;color:#5b6474;margin:0">Never share this email. Kreston Pedabo will never ask for your password.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
