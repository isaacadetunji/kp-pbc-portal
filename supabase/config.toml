# Supabase CLI config for local development (`supabase start`).
project_id = "kp-pbc-portal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Invitation only: nobody can self-register
enable_signup = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true   # required for email provider; signups still blocked above
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
# Absolute session lifetime; idle timeout is enforced by the app (SESSION_IDLE_MINUTES)
timebox = "12h"

# Email links go to /auth/confirm with a token hash (works with server-side auth)
[auth.email.template.invite]
subject = "You've been invited to the Kreston Pedabo PBC Portal"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your PBC Portal sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your PBC Portal password"
content_path = "./supabase/templates/recovery.html"
